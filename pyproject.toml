[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-factor-discovery"
version = "0.1.0"
description = "End-to-end neural discovery of conditional characteristic factors"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
